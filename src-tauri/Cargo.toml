[package]
name = "aigc-studio"
version = "0.2.0"
description = "Windows desktop workspace for AIGC education"
authors = ["AIGC Studio Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aigc_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
refinery = { version = "0.9.2", features = ["rusqlite"], default-features = false }
rusqlite = { version = "0.39.0", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
md-5 = "0.10"
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
aes-gcm = "0.10"
ureq = { version = "2", features = ["json"] }
argon2 = "0.5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
hmac = "0.12"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
