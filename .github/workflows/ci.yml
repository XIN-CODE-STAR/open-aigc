name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.7.0

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required files
        shell: bash
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
          test -f docs/README.md
          test -d src
          test -d assets
          test -d scripts

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type-check and build
        run: pnpm build

      - name: Inspect production licenses
        run: pnpm licenses:check

  windows-desktop:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Select Rust toolchain
        run: rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch ffmpeg sidecar
        run: node scripts/fetch-ffmpeg.mjs

      - name: Check Rust formatting
        shell: bash
        continue-on-error: true
        run: |
          echo '### cargo fmt --check（非阻塞）' >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          node scripts/run-with-rust-path.mjs cargo fmt --manifest-path src-tauri/Cargo.toml --check > /tmp/fmt.log 2>&1 || true
          head -150 /tmp/fmt.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ! grep -q '^Diff in' /tmp/fmt.log

      - name: Check Rust lints
        shell: bash
        run: |
          node scripts/run-with-rust-path.mjs cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings > /tmp/clippy.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo '### cargo clippy 输出' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -200 /tmp/clippy.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Test native workspace
        run: pnpm test:rust

      - name: Build Tauri executable
        run: pnpm tauri build --no-bundle --ci

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: aigc-studio-windows
          path: src-tauri/target/release/*.exe
          if-no-files-found: error
